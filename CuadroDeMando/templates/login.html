<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=999">
</head>

<body class="login-page">

    <div class="login-box">
        <div class="login-icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="34"
                height="34"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M4 4h6v7H4z"/>
                <path d="M14 4h6v4h-6z"/>
                <path d="M14 12h6v8h-6z"/>
                <path d="M4 15h6v5H4z"/>
            </svg>
        </div>
        <h3>Acceso al dashboard</h3>

        <div class="login-subtitle">
            Plataforma de auditoría web
        </div>

        <form method="POST">

            <input
                id="username-input"
                type="text"
                name="username"
                placeholder="Usuario"
                required
            >

            <input
                id="password-input"
                type="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button
                id="login-button"
                type="submit"
            >
                Iniciar sesión
            </button>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

        </form>

    </div>

</body>
</html>
