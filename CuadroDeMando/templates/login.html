<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=999">
</head>

<body class="login-page">

    <div class="login-box">

        <h3>Acceso al dashboard</h3>

        <div class="login-subtitle">
            Iniciar sesión
        </div>

        <form method="POST">

            <input
                id="username-input"
                type="text"
                name="username"
                placeholder="Usuario"
                required
            >

            <input
                id="password-input"
                type="password"
                name="password"
                placeholder="Contraseña"
                required
            >

            <button
                id="login-button"
                type="submit"
            >
                Iniciar sesión
            </button>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

        </form>

    </div>

</body>
</html>
